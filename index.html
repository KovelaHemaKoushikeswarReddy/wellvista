<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WellVista Diagnostics</title> 
    <link rel="icon" href="logo.png" type="image/x-icon"/>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="input-sidebar">
        <h2 id="web-title">WellVista</h2>
        <div class="logo-container">
            <img src="logo.png" alt="WellVista Logo">
        </div>
        <div id="error-box" class="error-toast" ></div>

        <div class="form-group">
            <label>Patient Name</label>
            <input type="text" id="p-name" placeholder="Enter name" pattern="[a-zA-z. ]">
        </div>

        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label>Age</label>
                <input type="number" id="p-age">
            </div>
            <div class="form-group">
                <label>Blood Pressure (mmHg)</label>
                <div class="form-row">
                    <input type="number" id="p-sys" placeholder="SYS" >
                    <span id="bar">/</span>
                    <input type="number" id="p-dia" placeholder="DIA">
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Height (cm)</label>
                <input type="number" id="p-height">
            </div>
            <div class="form-group">
                <label>Weight (kg)</label>
                <input type="number" id="p-weight">
            </div>
        </div>

        <div class="form-group">
            <label>Resting Pulse</label>
            <select id="p-pulse">
                <option value="">Select BPM</option>
            </select>
        </div>

        <div class="btn-row">
            <button class="calc-btn" onclick="processHealthData()">Analyze Vitals</button>
            <button id="clear-btn">Clear</button>
        </div>
    </div>

    <div class="results-main">
        
        <div id="report-header">
            <div id="report-header-main">
                <h3 id="display-name">Health Report: --</h3>
                <span id="display-age">Age: --</span>
            </div>
            <p id="report-date"></p>
        </div>

        <div class="vitals-banner">
            <div class="v-card"><span class="v-label">Systolic</span><span id="res-sys" class="v-value">--</span></div>
            <div class="v-card"><span class="v-label">Diastolic</span><span id="res-dia" class="v-value">--</span></div>
            <div class="v-card"><span class="v-label">Pulse</span><span id="res-pulse" class="v-value">--</span></div>
            <div class="v-card"><span class="v-label">BMI</span><span id="res-bmi" class="v-value">--</span></div>
        </div>

        <div class="index-display">
            <span class="v-label">Overall Health Index</span>
            <div id="index-num">--</div>
            <div class="status-bar">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <div id="status-label">READY FOR EVALUATION</div>
        </div>

        <div class="recommendation-box">
            <div class="rec-header">🩺 Clinical Recommendation</div>
            <div id="rec-content">Enter data to generate a summary.</div>
        </div>
       
        <div style="display:flex; gap:12px; justify-content:flex-end; align-items:center;">
            <button id="print-btn" class="print-btn" onclick="window.print()">Download Report (PDF)</button>
            <!-- <button id="export-current-btn" class="print-btn" style="background:#6b7280;" onclick="exportToCSV()">Export Current (CSV)</button> -->
            <button id="export-history-btn" class="print-btn" style="background:#10b981;" onclick="exportHistoryToCSV()">Export History (CSV)</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
